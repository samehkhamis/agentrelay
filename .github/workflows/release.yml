# Builds agentrelay for Linux and macOS when a version tag (v*) is pushed, and
# publishes the archives, with checksums, as a GitHub release. install.sh
# downloads from there.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=agentrelay-${{ matrix.target }}
          mkdir dist
          cp target/${{ matrix.target }}/release/agentrelay LICENSE README.md dist/
          tar -czf $name.tar.gz -C dist .
          if command -v sha256sum >/dev/null; then sha256sum $name.tar.gz; else shasum -a 256 $name.tar.gz; fi > $name.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: agentrelay-${{ matrix.target }}
          path: agentrelay-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" agentrelay-*.tar.gz* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
