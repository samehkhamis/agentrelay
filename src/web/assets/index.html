<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>agentchat</title>
  <link id="theme-css" rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside id="sidebar">
    <header class="workspace">
      <div class="workspace-name">agentchat</div>
      <div class="workspace-me"><span class="dot online"></span><span id="me"></span></div>
    </header>
    <nav id="channels"></nav>
    <footer class="hint"><span>Alt+↑↓ switch · /status</span><select id="theme" aria-label="Theme"></select></footer>
  </aside>
  <div id="backdrop"></div>
  <main>
    <header id="header">
      <button id="menu" type="button" aria-label="Channels">☰<span id="menu-badge" hidden></span></button>
      <div class="heading">
        <span id="title-dot"></span><h1 id="title"></h1><span id="detail"></span>
      </div>
      <div id="toast"></div>
    </header>
    <section id="feed" aria-live="polite"></section>
    <button id="jump" hidden>↓ Jump to latest</button>
    <form id="composer">
      <div id="attachments"></div>
      <div class="input-row">
        <span id="shell-mark" hidden>$</span>
        <textarea id="input" rows="1" autocomplete="off"></textarea>
        <button id="attach" type="button" aria-label="Attach files" title="Attach files">📎</button>
        <input id="file" type="file" multiple hidden>
      </div>
      <div class="composer-hint">Enter to send · Shift+Enter for a new line · drop or paste files to attach</div>
    </form>
    <div id="drop" hidden><div>Drop files to attach</div></div>
    <dialog id="new-agent">
      <form method="dialog" id="new-form">
        <h2>New agent</h2>
        <div class="kinds">
          <label><input type="radio" name="kind" value="claude" checked> Claude</label>
          <label><input type="radio" name="kind" value="codex"> Codex</label>
        </div>
        <label class="field">Folder<select id="new-folder" required></select></label>
        <label class="field">First message <span class="optional">optional; leave empty to start it idle</span>
          <textarea id="new-prompt" rows="3"></textarea></label>
        <p class="note">Starts in bypass mode, like your other sessions.</p>
        <div class="actions">
          <button type="button" id="new-cancel">Cancel</button>
          <button type="submit" id="new-start" class="primary">Start</button>
        </div>
      </form>
    </dialog>
  </main>
  <script src="/app.js"></script>
</body>
</html>
