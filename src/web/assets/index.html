<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agentchat</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside id="sidebar">
    <header class="workspace">
      <div class="workspace-name">agentchat</div>
      <div class="workspace-me"><span class="dot online"></span><span id="me"></span></div>
    </header>
    <nav id="channels"></nav>
    <footer class="hint">Alt+↑↓ switch · /status · /sound</footer>
  </aside>
  <main>
    <header id="header">
      <div class="heading">
        <span id="title-dot"></span><h1 id="title"></h1><span id="detail"></span>
      </div>
      <div id="toast"></div>
    </header>
    <section id="feed" aria-live="polite"></section>
    <button id="jump" hidden>↓ Jump to latest</button>
    <form id="composer">
      <textarea id="input" rows="1" autocomplete="off"></textarea>
      <div class="composer-hint">Enter to send · Shift+Enter for a new line</div>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
