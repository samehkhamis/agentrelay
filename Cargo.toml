[package]
name = "agentchat"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
cpal = { version = "0.18.2", features = ["pulseaudio"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
ratatui = "0.30.2"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
textwrap = "0.16.4"
tiny_http = "0.12.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
unicode-width = "0.2.2"
